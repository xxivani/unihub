name: CI - Build, Push Docker & Deploy

on:
  push:
    branches:
      - team77-new  # Runs when you push to 'team77-new'
  pull_request:
    branches:
      - team77-new  # Runs when a PR is made to 'team77-new'

jobs:
  publish-docker:
    name: Publish Docker
    runs-on: self-hosted  # Use self-hosted runner 
    permissions:
      contents: read
      packages: write
    services:
      docker:
        image: docker:dind
        options: >-
          --privileged
          --env DOCKER_TLS_CERTDIR=
        ports:
          - 2375:2375
    env:
      DOCKER_HOST: 'tcp://127.0.0.1:2375'
      DOCKER_DRIVER: overlay2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for Docker Daemon
        run: |
          for i in {1..10}; do
            if docker info; then
              break
            fi
            echo "Waiting for Docker Daemon..."
            sleep 3
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/unihub-server:latest ./server
          docker push ghcr.io/${{ github.repository_owner }}/unihub-server:latest

      - name: Build and push Frontend Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/unihub-client:latest ./client
          docker push ghcr.io/${{ github.repository_owner }}/unihub-client:latest

  deploy-dev:
    name: Deploy to Development Server
    runs-on: self-hosted
    needs: publish-docker
    if: startsWith(github.ref, 'refs/tags/')

    env:
      RSA_PRIVATE_KEY: ${{ secrets.RSA_PRIVATE_KEY }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_IP: ${{ secrets.DEPLOY_IP }}

    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "$RSA_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          eval $(ssh-agent -s)
          ssh-add ~/.ssh/id_rsa

      - name: Add SSH known hosts
        run: |
          ssh-keyscan -H $DEPLOY_IP >> ~/.ssh/known_hosts

      - name: Deploy Application via SSH
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "
            docker pull ghcr.io/${{ github.repository_owner }}/unihub-server:latest
            docker pull ghcr.io/${{ github.repository_owner }}/unihub-client:latest
            docker-compose -f ~/unihub/docker-compose.yml up -d
          "
