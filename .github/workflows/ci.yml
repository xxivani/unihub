name: CI - Checks if Frontend & Backend Compile

on:
  push:
    branches:
      - team77-new  # Runs on 'team77-new' branch only
  pull_request:
    branches:
      - team77-new  # Runs on PRs to 'team77-new' branch

jobs:
  build:
    runs-on: self-hosted


    steps:
      # Checkout the repository (Manual Clone)
      - name: clone repository
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/uob-team-project/team77.git
          cd team77
          git checkout team77-new

      # Install Node.js manually
      - name: Set up Node.js (Manual)
        run: |
          curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
          sudo apt-get install -y nodejs
          node -v
          npm -v

      # Install & Build Backend (Server)
      - name: Install and Build Backend (server)
        run: |
          cd team77/server
          npm install
          npm run build || echo "⚠️ No build script found, skipping..."

      # Install & Build Frontend (Client)
      - name: Install and Build Frontend (client)
        run: |
          cd team77/client
          npm install
          npm run build || echo "⚠️ No build script found, skipping..."

      # Confirm build
      - name: Build Completed Successfully
        run: echo "Build process finished successfully"
