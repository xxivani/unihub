name: Build, Push, and Deploy Docker Images

on:
  push:
    branches:
      - main
      - development
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Server Image
        run: |
          docker build -t ghcr.io/uob-team-project/team77-server:${{ github.sha }} ./server
          docker tag ghcr.io/uob-team-project/team77-server:${{ github.sha }} ghcr.io/uob-team-project/team77-server:latest
          docker push ghcr.io/uob-team-project/team77-server:${{ github.sha }}
          docker push ghcr.io/uob-team-project/team77-server:latest

      - name: Build and Push Client Image (Development)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          echo "Building client for development environment"
          docker build \
            --build-arg VITE_API_URL="https://team77.dev.bham.team/api" \
            -t ghcr.io/uob-team-project/team77-client:${{ github.sha }} \
            ./client
          
          docker tag ghcr.io/uob-team-project/team77-client:${{ github.sha }} ghcr.io/uob-team-project/team77-client:latest
          docker push ghcr.io/uob-team-project/team77-client:${{ github.sha }}
          docker push ghcr.io/uob-team-project/team77-client:latest

      - name: Build and Push Client Image (Production)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "Building client for production environment"
          docker build \
            --build-arg VITE_API_URL="https://team77.bham.team/api" \
            -t ghcr.io/uob-team-project/team77-client:${{ github.sha }} \
            ./client
          
          docker tag ghcr.io/uob-team-project/team77-client:${{ github.sha }} ghcr.io/uob-team-project/team77-client:latest
          docker push ghcr.io/uob-team-project/team77-client:${{ github.sha }}
          docker push ghcr.io/uob-team-project/team77-client:latest

          
  deploy-dev:
    name: Deploy Development
    needs: build-push
    runs-on: self-hosted
    if: success() && ( contains(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/tags/') )
    concurrency:
      group: deployment
    env:
      RSA_PRIVATE_KEY: ${{ secrets.RSA_PRIVATE_KEY }}
      DEPLOY_IP: ${{ secrets.DEPLOY_IP }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up SSH key for connection
        run: |
          mkdir -p ~/.ssh
          echo "$RSA_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa

      - name: Add SSH known hosts
        run: |
          ssh-keyscan -H ${{ secrets.DEPLOY_IP }} >> ~/.ssh/known_hosts

      - name: Clear previous deployment on VM (Dev)
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "rm -rf ~/team-project || true"

      - name: Create db.env on VM (Dev)
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "mkdir -p ~/team-project && printf '%s' '${{ secrets.DB_ENV_DEV }}' > ~/team-project/db.env"

      - name: Transfer deployment files to VM (Dev)
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "mkdir -p ~/team-project"
          scp -o StrictHostKeyChecking=no -r ./docker/* $DEPLOY_USER@$DEPLOY_IP:~/team-project/
          # Transfer migration helpers with recursive flag for directories
          scp -o StrictHostKeyChecking=no -r ./server/src/migrations $DEPLOY_USER@$DEPLOY_IP:~/team-project/migrations
          scp -o StrictHostKeyChecking=no -r ./server/src/seeders $DEPLOY_USER@$DEPLOY_IP:~/team-project/seeders
          scp -o StrictHostKeyChecking=no -r ./server/src/models $DEPLOY_USER@$DEPLOY_IP:~/team-project/models

      - name: Clean up old containers on VM (Dev)
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "docker compose -f ~/team-project/dev.yml -p team77-dev down --volumes --remove-orphans || true && docker container prune -f"

      - name: Start Database Container (Dev)
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "
            # Make sure the common-network exists but don't recreate it if it does
            docker network inspect common-network >/dev/null 2>&1 || docker network create common-network
            
            # Start just the database container
            docker compose -f ~/team-project/dev.yml -p team77-dev up -d db
          "

      - name: Wait for Database to be fully ready (Dev)
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "
            # Wait for the database to be properly initialized
            for i in \$(seq 1 60); do
              echo \"Attempt \$i: Checking database readiness...\"
              if docker exec team77-dev-db pg_isready -U team77 -d UniHub && 
                docker exec team77-dev-db psql -U team77 -d UniHub -c 'SELECT 1' > /dev/null 2>&1; then
                echo \"Database is ready and can execute queries!\"
                sleep 5 
                break
              fi
              echo \"Database not ready yet. Waiting...\"
              sleep 5
            done
          "

      - name: Run Migrations and Seeders (Dev)
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "
            # Create a temporary container to run migrations
            docker run --rm --name team77-migrations \
              --network common-network \
              -e NODE_ENV=development \
              -e DATABASE_URL=postgres://team77:team77@team77-dev-db:5432/UniHub \
              -e POSTGRES_USER=team77 \
              -e POSTGRES_PASSWORD=team77 \
              -e POSTGRES_DB=UniHub \
              -e DB_HOST=team77-dev-db \
              -e DB_PORT=5432 \
              -v ~/team-project/migrations:/app/migrations \
              -v ~/team-project/seeders:/app/seeders \
              -v ~/team-project/models:/app/models \
              ghcr.io/uob-team-project/team77-server:latest \
              sh -c 'cd /app && npx sequelize-cli db:migrate && npx sequelize-cli db:seed:all'
          "

      - name: Clean and Init Upload Directory (Dev)
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "
            # Remove the old volumes if they exist
            docker volume rm team77-dev_dev-uploads || true
            
            # Create temporary container to initialize upload directories
            docker run --rm \
              --name upload-init-dev \
              -v team77-dev_dev-uploads:/app/uploads \
              alpine:latest \
              sh -c 'mkdir -p /app/uploads/{images,pdfs,misc} && chmod -R 777 /app/uploads'
          "

      - name: Start Remaining Services (Dev)
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "
            docker compose -f ~/team-project/dev.yml -p team77-dev up -d && 
            docker system prune --force --filter 'until=24h'
          "

      - name: Wait for Dev Stack to be Ready
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "sleep 30"

      - name: Remove Previous Reverse Proxy (if any)
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "docker rm -f team77-nginx || true"

      - name: Deploy Reverse Proxy (Dev)
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "cd ~/team-project && docker compose -f reverse-proxy.yml -p team77-proxy up -d --remove-orphans"

  deploy-prod:
    name: Deploy Production
    needs: deploy-dev
    runs-on: self-hosted
    if: success() && startsWith(github.ref, 'refs/tags/')
    concurrency:
      group: deployment
    env:
      RSA_PRIVATE_KEY: ${{ secrets.RSA_PRIVATE_KEY }}
      DEPLOY_IP: ${{ secrets.DEPLOY_IP }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up SSH key for connection
        run: |
          mkdir -p ~/.ssh
          echo "$RSA_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa

      - name: Add SSH known hosts
        run: |
          ssh-keyscan -H ${{ secrets.DEPLOY_IP }} >> ~/.ssh/known_hosts

      - name: Clear previous deployment on VM (Prod)
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "rm -rf ~/team-project || true"

      - name: Create db.env on VM (Prod)
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "mkdir -p ~/team-project && printf '%s' '${{ secrets.DB_ENV_PRD }}' > ~/team-project/db.env"
          
      - name: Transfer deployment files to VM (Prod)
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "mkdir -p ~/team-project"
          scp -o StrictHostKeyChecking=no -r ./docker/* $DEPLOY_USER@$DEPLOY_IP:~/team-project/
          # Transfer migration helpers with recursive flag for directories
          scp -o StrictHostKeyChecking=no -r ./server/src/migrations $DEPLOY_USER@$DEPLOY_IP:~/team-project/migrations
          scp -o StrictHostKeyChecking=no -r ./server/src/seeders $DEPLOY_USER@$DEPLOY_IP:~/team-project/seeders
          scp -o StrictHostKeyChecking=no -r ./server/src/models $DEPLOY_USER@$DEPLOY_IP:~/team-project/models

      - name: Clean up old containers on VM (Prod)
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP \
            "docker compose -f ~/team-project/prd.yml -p team77-prod down --volumes --remove-orphans || true && docker container prune -f"

      - name: Start Database Container (Prod)
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "
            # Make sure the common-network exists but don't recreate it if it does
            docker network inspect common-network >/dev/null 2>&1 || docker network create common-network
            
            # Start just the database container
            docker compose -f ~/team-project/prd.yml -p team77-prod up -d db
          "

      - name: Wait for Database to be fully ready (Prod)
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "
            # Wait for the database to be properly initialized
            for i in \$(seq 1 60); do
              echo \"Attempt \$i: Checking database readiness...\"
              if docker exec team77-db pg_isready -U team77 -d UniHub; then
                echo \"Database is ready!\"
                sleep 5  # Give it a little extra time to be fully initialized
                break
              fi
              echo \"Database not ready yet. Waiting...\"
              sleep 5
            done
          "

      - name: Run Migrations and Seeders (Prod)
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "
            # Create a temporary container to run migrations
            docker run --rm --name team77-migrations \
              --network common-network \
              -e NODE_ENV=production \
              -e DATABASE_URL=postgres://team77:team77@team77-db:5432/UniHub \
              -e POSTGRES_USER=team77 \
              -e POSTGRES_PASSWORD=team77 \
              -e POSTGRES_DB=UniHub \
              -e DB_HOST=team77-db \
              -e DB_PORT=5432 \
              -v ~/team-project/migrations:/app/migrations \
              -v ~/team-project/seeders:/app/seeders \
              -v ~/team-project/models:/app/models \
              ghcr.io/uob-team-project/team77-server:latest \
              sh -c 'cd /app && npx sequelize-cli db:migrate && npx sequelize-cli db:seed:all'
          "

      - name: Clean and Init Upload Directory (Prod)
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "
            # Remove the old volumes if they exist
            docker volume rm team77-prod_uploads || true
            
            # Create temporary container to initialize upload directories
            docker run --rm \
              --name upload-init \
              -v team77-prod_uploads:/app/uploads \
              alpine:latest \
              sh -c 'mkdir -p /app/uploads/{images,pdfs,misc} && chmod -R 777 /app/uploads'
          "

      - name: Start Remaining Services (Prod)
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "
            docker compose -f ~/team-project/prd.yml -p team77-prod up -d && 
            docker system prune --force --filter 'until=24h'
          "

      - name: Wait for Prod Stack to be Ready
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "sleep 20"

      - name: Remove Previous Reverse Proxy (if any)
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "docker rm -f team77-nginx || true"

      - name: Deploy Reverse Proxy (Prod)
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "cd ~/team-project && docker compose -f reverse-proxy.yml -p team77-proxy up -d --remove-orphans"