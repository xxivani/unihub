name: Build, Push, and Deploy Docker Images

on:
  push:
    branches:
      - main
      - development
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Server Image
        run: |
          docker build -t ghcr.io/uob-team-project/team77-server:${{ github.sha }} ./server
          docker tag ghcr.io/uob-team-project/team77-server:${{ github.sha }} ghcr.io/uob-team-project/team77-server:latest
          docker push ghcr.io/uob-team-project/team77-server:${{ github.sha }}
          docker push ghcr.io/uob-team-project/team77-server:latest

      - name: Build and Push Client Image (Development)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          echo "Building client for development environment"
          docker build \
            --build-arg VITE_API_URL="${{ secrets.DEV_API_URL }}" \
            -t ghcr.io/uob-team-project/team77-client:${{ github.sha }} \
            ./client
          
          docker tag ghcr.io/uob-team-project/team77-client:${{ github.sha }} ghcr.io/uob-team-project/team77-client:latest
          docker push ghcr.io/uob-team-project/team77-client:${{ github.sha }}
          docker push ghcr.io/uob-team-project/team77-client:latest

      - name: Build and Push Client Image (Production)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "Building client for production environment"
          docker build \
            --build-arg VITE_API_URL="${{ secrets.PROD_API_URL }}" \
            -t ghcr.io/uob-team-project/team77-client:${{ github.sha }} \
            ./client
          
          docker tag ghcr.io/uob-team-project/team77-client:${{ github.sha }} ghcr.io/uob-team-project/team77-client:latest
          docker push ghcr.io/uob-team-project/team77-client:${{ github.sha }}
          docker push ghcr.io/uob-team-project/team77-client:latest
          
  deploy-dev:
    name: Deploy Development
    needs: build-push
    runs-on: self-hosted
    if: success() && ( contains(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/tags/') )
    concurrency:
      group: deployment-dev
    env:
      RSA_PRIVATE_KEY: ${{ secrets.RSA_PRIVATE_KEY }}
      DEPLOY_IP: ${{ secrets.DEPLOY_IP }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up SSH key for connection
        run: |
          mkdir -p ~/.ssh
          echo "$RSA_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa

      - name: Add SSH known hosts
        run: |
          ssh-keyscan -H ${{ secrets.DEPLOY_IP }} >> ~/.ssh/known_hosts

      - name: Create project directory on VM
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "mkdir -p ~/team-project || true"

      - name: Check permissions and fix if needed
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "
            # Check if user can write to the directory
            if ! touch ~/team-project/test_perm 2>/dev/null; then
              echo 'Permission issues detected, attempting to fix'
              # Ask server admin to fix permissions 
              sudo chown -R $USER:$USER ~/team-project || true
            else
              rm ~/team-project/test_perm
              echo 'Permissions look good'
            fi
          " || echo "Could not fix permissions, continuing anyway."

      - name: Transfer common deployment files to VM
        run: |
          # Transfer core files
          scp -o StrictHostKeyChecking=no -r ./docker/dev.yml $DEPLOY_USER@$DEPLOY_IP:~/team-project/
          scp -o StrictHostKeyChecking=no -r ./docker/prd.yml $DEPLOY_USER@$DEPLOY_IP:~/team-project/
          scp -o StrictHostKeyChecking=no -r ./docker/reverse-proxy.yml $DEPLOY_USER@$DEPLOY_IP:~/team-project/
          scp -o StrictHostKeyChecking=no -r ./docker/nginx.conf $DEPLOY_USER@$DEPLOY_IP:~/team-project/
          
          # Create directories for migrations and models
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "
            mkdir -p ~/team-project/migrations
            mkdir -p ~/team-project/seeders
            mkdir -p ~/team-project/models
          " || echo "Could not create directories, continuing anyway."
          
          # Transfer migration files
          scp -o StrictHostKeyChecking=no -r ./server/src/migrations/* $DEPLOY_USER@$DEPLOY_IP:~/team-project/migrations/ || echo "Error transferring migrations, continuing anyway."
          scp -o StrictHostKeyChecking=no -r ./server/src/seeders/* $DEPLOY_USER@$DEPLOY_IP:~/team-project/seeders/ || echo "Error transferring seeders, continuing anyway."
          scp -o StrictHostKeyChecking=no -r ./server/src/models/* $DEPLOY_USER@$DEPLOY_IP:~/team-project/models/ || echo "Error transferring models, continuing anyway."

      - name: Create networks
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "
            # Create required networks
            docker network inspect common-network >/dev/null 2>&1 || docker network create common-network
            docker network inspect team77-dev-network >/dev/null 2>&1 || docker network create team77-dev-network
            docker network inspect team77-prod-network >/dev/null 2>&1 || docker network create team77-prod-network
          "

      - name: Deploy Development Environment
        run: |
          # Create environment files for development (with temporary file approach to avoid permission issues)
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "
            # Create development environment variables
            cat > /tmp/dev_db.env << 'EOL'
            POSTGRES_USER=${{ secrets.DEV_DB_USER }}
            POSTGRES_PASSWORD=${{ secrets.DEV_DB_PASSWORD }}
            POSTGRES_DB=${{ secrets.DEV_DB_NAME }}
            EOL
            
            cat > /tmp/dev_server.env << 'EOL'
            NODE_ENV=development
            PORT=8080
            POSTGRES_USER=${{ secrets.DEV_DB_USER }}
            POSTGRES_PASSWORD=${{ secrets.DEV_DB_PASSWORD }}
            POSTGRES_DB=${{ secrets.DEV_DB_NAME }}
            DB_HOST=db
            DB_PORT=5432
            DATABASE_URL=postgres://${{ secrets.DEV_DB_USER }}:${{ secrets.DEV_DB_PASSWORD }}@db:5432/${{ secrets.DEV_DB_NAME }}
            JWT_SECRET=${{ secrets.DEV_JWT_SECRET }}
            EOL
            
            cat > /tmp/dev_client.env << 'EOL'
            NODE_ENV=development
            PORT=3000
            REACT_APP_API_URL=${{ secrets.DEV_API_URL }}
            VITE_API_URL=${{ secrets.DEV_API_URL }}
            EOL
            
            # Move files to final destination
            sudo cp /tmp/dev_db.env ~/team-project/dev_db.env || cp /tmp/dev_db.env ~/team-project/dev_db.env
            sudo cp /tmp/dev_server.env ~/team-project/dev_server.env || cp /tmp/dev_server.env ~/team-project/dev_server.env
            sudo cp /tmp/dev_client.env ~/team-project/dev_client.env || cp /tmp/dev_client.env ~/team-project/dev_client.env
            
            # Remove temporary files
            rm /tmp/dev_*.env
          "
          
          # Clean up development environment
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "
            # Stop and remove containers and volumes
            cd ~/team-project && docker compose -f dev.yml -p team77-dev down --volumes --remove-orphans || true
            
            # Remove volumes explicitly
            docker volume rm team77-dev-db-data team77-dev-uploads || true
            
            # Prune unused resources
            docker container prune -f
            docker volume prune -f
            
            # Start database container
            cd ~/team-project && docker compose -f dev.yml -p team77-dev up -d db
            
            # Wait for database to be ready
            for i in \$(seq 1 60); do
              echo \"Attempt \$i: Checking database readiness...\"
              if docker exec team77-dev-db pg_isready; then
                echo \"Database is accepting connections!\"
                sleep 10
                break
              fi
              sleep 5
            done
            
            # Run migrations
            mkdir -p ~/team-project/config
            cat > ~/team-project/config/config.js << 'EOL'
            module.exports = {
              development: {
                username: '${{ secrets.DEV_DB_USER }}',
                password: '${{ secrets.DEV_DB_PASSWORD }}',
                database: '${{ secrets.DEV_DB_NAME }}',
                host: 'db',
                dialect: 'postgres',
                dialectOptions: {
                  useUTC: false,
                  prependSearchPath: true
                },
                searchPath: 'public',
                define: {
                  freezeTableName: true,
                  underscored: false
                }
              }
            };
            EOL
            
            # Run migrations
            docker run --rm --name team77-migrations-dev \
              --network team77-dev-network \
              -v ~/team-project/migrations:/app/migrations \
              -v ~/team-project/seeders:/app/seeders \
              -v ~/team-project/models:/app/models \
              -v ~/team-project/config:/app/src/config \
              -e NODE_ENV=development \
              ghcr.io/uob-team-project/team77-server:latest \
              sh -c 'cd /app && npx sequelize-cli db:migrate && npx sequelize-cli db:seed:all'
            
            # Initialize upload directories
            docker run --rm \
              --name upload-init-dev \
              -v team77-dev-uploads:/app/uploads \
              alpine:latest \
              sh -c 'mkdir -p /app/uploads/{images,pdfs,misc} && chmod -R 777 /app/uploads'
            
            # Start all services
            cd ~/team-project && docker compose -f dev.yml -p team77-dev up -d
            
            # Prune old resources
            docker system prune --force --filter 'until=24h'
            
            # Remove old NGINX container
            docker rm -f team77-nginx || true
            
            # Deploy reverse proxy
            cd ~/team-project && docker compose -f reverse-proxy.yml -p team77-proxy up -d --remove-orphans
          "

  deploy-prod:
    name: Deploy Production
    needs: deploy-dev
    runs-on: self-hosted
    if: success() && startsWith(github.ref, 'refs/tags/')
    concurrency:
      group: deployment-prod
    env:
      RSA_PRIVATE_KEY: ${{ secrets.RSA_PRIVATE_KEY }}
      DEPLOY_IP: ${{ secrets.DEPLOY_IP }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up SSH key for connection
        run: |
          mkdir -p ~/.ssh
          echo "$RSA_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa

      - name: Add SSH known hosts
        run: |
          ssh-keyscan -H ${{ secrets.DEPLOY_IP }} >> ~/.ssh/known_hosts

      - name: Deploy Production Environment
        run: |
          # Create environment files for production (with temporary file approach to avoid permission issues)
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "
            # Create production environment variables
            cat > /tmp/prod_db.env << 'EOL'
            POSTGRES_USER=${{ secrets.PROD_DB_USER }}
            POSTGRES_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}
            POSTGRES_DB=${{ secrets.PROD_DB_NAME }}
            EOL
            
            cat > /tmp/prod_server.env << 'EOL'
            NODE_ENV=production
            PORT=8080
            POSTGRES_USER=${{ secrets.PROD_DB_USER }}
            POSTGRES_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}
            POSTGRES_DB=${{ secrets.PROD_DB_NAME }}
            DB_HOST=db
            DB_PORT=5432
            DATABASE_URL=postgres://${{ secrets.PROD_DB_USER }}:${{ secrets.PROD_DB_PASSWORD }}@db:5432/${{ secrets.PROD_DB_NAME }}
            JWT_SECRET=${{ secrets.PROD_JWT_SECRET }}
            EOL
            
            cat > /tmp/prod_client.env << 'EOL'
            NODE_ENV=production
            PORT=8080
            REACT_APP_API_URL=${{ secrets.PROD_API_URL }}
            VITE_API_URL=${{ secrets.PROD_API_URL }}
            EOL
            
            # Move files to final destination
            sudo cp /tmp/prod_db.env ~/team-project/prod_db.env || cp /tmp/prod_db.env ~/team-project/prod_db.env
            sudo cp /tmp/prod_server.env ~/team-project/prod_server.env || cp /tmp/prod_server.env ~/team-project/prod_server.env
            sudo cp /tmp/prod_client.env ~/team-project/prod_client.env || cp /tmp/prod_client.env ~/team-project/prod_client.env
            
            # Remove temporary files
            rm /tmp/prod_*.env
          "
          
          # Clean up production environment
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "
            # Stop and remove containers and volumes
            cd ~/team-project && docker compose -f prd.yml -p team77-prod down --volumes --remove-orphans || true
            
            # Remove volumes explicitly
            docker volume rm team77-prod-db-data team77-prod-uploads || true
            
            # Prune unused resources
            docker container prune -f
            docker volume prune -f
            
            # Start database container
            cd ~/team-project && docker compose -f prd.yml -p team77-prod up -d db
            
            # Wait for database to be ready
            for i in \$(seq 1 60); do
              echo \"Attempt \$i: Checking database readiness...\"
              if docker exec team77-prod-db pg_isready; then
                echo \"Database is accepting connections!\"
                sleep 10
                break
              fi
              sleep 5
            done
            
            # Run migrations
            mkdir -p ~/team-project/config
            cat > ~/team-project/config/config.js << 'EOL'
            module.exports = {
              production: {
                username: '${{ secrets.PROD_DB_USER }}',
                password: '${{ secrets.PROD_DB_PASSWORD }}',
                database: '${{ secrets.PROD_DB_NAME }}',
                host: 'db',
                dialect: 'postgres',
                dialectOptions: {
                  useUTC: false,
                  prependSearchPath: true
                },
                searchPath: 'public',
                define: {
                  freezeTableName: true,
                  underscored: false
                }
              }
            };
            EOL
            
            # Run migrations
            docker run --rm --name team77-migrations-prod \
              --network team77-prod-network \
              -v ~/team-project/migrations:/app/migrations \
              -v ~/team-project/seeders:/app/seeders \
              -v ~/team-project/models:/app/models \
              -v ~/team-project/config:/app/src/config \
              -e NODE_ENV=production \
              ghcr.io/uob-team-project/team77-server:latest \
              sh -c 'cd /app && npx sequelize-cli db:migrate && npx sequelize-cli db:seed:all'
            
            # Initialize upload directories
            docker run --rm \
              --name upload-init-prod \
              -v team77-prod-uploads:/app/uploads \
              alpine:latest \
              sh -c 'mkdir -p /app/uploads/{images,pdfs,misc} && chmod -R 777 /app/uploads'
            
            # Start all services
            cd ~/team-project && docker compose -f prd.yml -p team77-prod up -d
            
            # Prune old resources
            docker system prune --force --filter 'until=24h'
          "