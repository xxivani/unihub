name: Build, Push, and Deploy Docker Images

on:
  push:
    branches:
      - main
      - development
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Server Image
        run: |
          docker build -t ghcr.io/uob-team-project/team77-server:${{ github.sha }} ./server
          docker tag ghcr.io/uob-team-project/team77-server:${{ github.sha }} ghcr.io/uob-team-project/team77-server:latest
          docker push ghcr.io/uob-team-project/team77-server:${{ github.sha }}
          docker push ghcr.io/uob-team-project/team77-server:latest

      - name: Build and Push Client Image (Development)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          echo "Building client for development environment"
          docker build \
            --build-arg VITE_API_URL="${{ secrets.DEV_API_URL }}" \
            -t ghcr.io/uob-team-project/team77-client:${{ github.sha }} \
            ./client
          
          docker tag ghcr.io/uob-team-project/team77-client:${{ github.sha }} ghcr.io/uob-team-project/team77-client:latest
          docker push ghcr.io/uob-team-project/team77-client:${{ github.sha }}
          docker push ghcr.io/uob-team-project/team77-client:latest

      - name: Build and Push Client Image (Production)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "Building client for production environment"
          docker build \
            --build-arg VITE_API_URL="${{ secrets.PROD_API_URL }}" \
            -t ghcr.io/uob-team-project/team77-client:${{ github.sha }} \
            ./client
          
          docker tag ghcr.io/uob-team-project/team77-client:${{ github.sha }} ghcr.io/uob-team-project/team77-client:latest
          docker push ghcr.io/uob-team-project/team77-client:${{ github.sha }}
          docker push ghcr.io/uob-team-project/team77-client:latest
          
  deploy-dev:
    name: Deploy Development
    needs: build-push
    runs-on: self-hosted
    if: success() && ( contains(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/tags/') )
    concurrency:
      group: deployment-dev
    env:
      RSA_PRIVATE_KEY: ${{ secrets.RSA_PRIVATE_KEY }}
      DEPLOY_IP: ${{ secrets.DEPLOY_IP }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up SSH key for connection
        run: |
          mkdir -p ~/.ssh
          echo "$RSA_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa

      - name: Add SSH known hosts
        run: |
          ssh-keyscan -H ${{ secrets.DEPLOY_IP }} >> ~/.ssh/known_hosts

      - name: Stop NGINX before deployment
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "
            # Force kill the container if it exists
            docker kill team77-nginx || true
            # Sleep to ensure it's fully stopped
            sleep 5
            # Force remove the container
            docker rm -f team77-nginx || true
            # Sleep again to ensure Docker has released the resources
            sleep 5
          "

      - name: Clear previous deployment on VM (Dev)
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "rm -rf ~/team-project-dev || true"

      - name: Create environment files on VM (Dev)
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "mkdir -p ~/team-project-dev"
          
          # Create db.env file
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "cat > ~/team-project-dev/db.env << 'EOL'
          POSTGRES_USER=${{ secrets.DEV_DB_USER }}
          POSTGRES_PASSWORD=${{ secrets.DEV_DB_PASSWORD }}
          POSTGRES_DB=${{ secrets.DEV_DB_NAME }}
          EOL"
          
          # Create server.env file with proper database connection parameters
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "cat > ~/team-project-dev/server.env << 'EOL'
          NODE_ENV=development
          PORT=8080
          JWT_SECRET=${{ secrets.DEV_JWT_SECRET }}
          DATABASE_URL=postgres://${{ secrets.DEV_DB_USER }}:${{ secrets.DEV_DB_PASSWORD }}@db:5432/${{ secrets.DEV_DB_NAME }}
          DB_HOST=db
          DB_PORT=5432
          POSTGRES_USER=${{ secrets.DEV_DB_USER }}
          POSTGRES_PASSWORD=${{ secrets.DEV_DB_PASSWORD }}
          POSTGRES_DB=${{ secrets.DEV_DB_NAME }}
          EOL"
          
          # Create client.env file
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "cat > ~/team-project-dev/client.env << 'EOL'
          REACT_APP_API_URL=${{ secrets.DEV_API_URL }}
          VITE_API_URL=${{ secrets.DEV_API_URL }}
          EOL"

      - name: Transfer deployment files to VM (Dev)
        run: |
          scp -o StrictHostKeyChecking=no -r ./docker/dev.yml $DEPLOY_USER@$DEPLOY_IP:~/team-project-dev/
          scp -o StrictHostKeyChecking=no -r ./docker/reverse-proxy.yml $DEPLOY_USER@$DEPLOY_IP:~/team-project-dev/
          scp -o StrictHostKeyChecking=no -r ./docker/nginx.conf $DEPLOY_USER@$DEPLOY_IP:~/team-project-dev/
          # Transfer migration helpers with recursive flag for directories
          scp -o StrictHostKeyChecking=no -r ./server/src/migrations $DEPLOY_USER@$DEPLOY_IP:~/team-project-dev/migrations
          scp -o StrictHostKeyChecking=no -r ./server/src/seeders $DEPLOY_USER@$DEPLOY_IP:~/team-project-dev/seeders
          scp -o StrictHostKeyChecking=no -r ./server/src/models $DEPLOY_USER@$DEPLOY_IP:~/team-project-dev/models

      - name: Create required network
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "
            # Make sure the common-network exists but don't recreate it if it does
            docker network inspect common-network >/dev/null 2>&1 || docker network create common-network
          "

      - name: Clean up old containers and volumes on VM (Dev)
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "
            # Stop and remove all containers in the dev project
            docker compose -f ~/team-project-dev/dev.yml -p team77-dev down --volumes --remove-orphans || true
            
            # Explicitly remove volumes
            docker volume rm team77-dev-db-data team77-dev-uploads || true
            
            # Prune unused containers
            docker container prune -f
            
            # Create fresh volumes
            docker volume create team77-dev-db-data
            docker volume create team77-dev-uploads
            
            # Initialize upload directories
            docker run --rm \
              --name upload-init-dev \
              -v team77-dev-uploads:/app/uploads \
              alpine:latest \
              sh -c 'mkdir -p /app/uploads/{images,pdfs,misc} && chmod -R 777 /app/uploads'
          "

      - name: Start Database Container (Dev)
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "
            # Start just the database container
            docker compose -f ~/team-project-dev/dev.yml -p team77-dev up -d db
          "

      - name: Wait for Database to be fully ready (Dev)
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "
            # Wait for the database to be properly initialized
            for i in \$(seq 1 60); do
              echo \"Attempt \$i: Checking database readiness...\"
              
              # Simpler check - just verify the server is accepting connections
              if docker exec team77-dev-db pg_isready; then
                echo \"Database is accepting connections!\"
                # Give it a little extra time to fully initialize
                sleep 10
                break
              fi
              
              echo \"Database not ready yet. Waiting...\"
              sleep 5
            done
          "

      - name: Run Migrations and Seeders (Dev)
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "
            # Create temporary config file with database connection
            mkdir -p ~/team-project-dev/config
            cat > ~/team-project-dev/config/config.js << 'EOL'
            module.exports = {
              development: {
                username: '${{ secrets.DEV_DB_USER }}',
                password: '${{ secrets.DEV_DB_PASSWORD }}',
                database: '${{ secrets.DEV_DB_NAME }}',
                host: 'db',
                dialect: 'postgres',
                dialectOptions: {
                  useUTC: false,
                  prependSearchPath: true
                },
                searchPath: 'public',
                define: {
                  freezeTableName: true,
                  underscored: false
                }
              }
            };
            EOL
            
            # Create a temporary container to run migrations
            docker run --rm --name team77-migrations-dev \
              --network common-network \
              -v ~/team-project-dev/migrations:/app/migrations \
              -v ~/team-project-dev/seeders:/app/seeders \
              -v ~/team-project-dev/models:/app/models \
              -v ~/team-project-dev/config:/app/src/config \
              -e NODE_ENV=development \
              ghcr.io/uob-team-project/team77-server:latest \
              sh -c 'cd /app && npx sequelize-cli db:migrate && npx sequelize-cli db:seed:all'
          "

      - name: Start Remaining Services (Dev)
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "
            docker compose -f ~/team-project-dev/dev.yml -p team77-dev up -d && 
            docker system prune --force --filter 'until=24h'
          "

      - name: Deploy nginx for Development
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "cd ~/team-project-dev && docker compose -f reverse-proxy.yml -p team77-proxy up -d --remove-orphans"

  deploy-prod:
    name: Deploy Production
    needs: deploy-dev
    runs-on: self-hosted
    if: success() && startsWith(github.ref, 'refs/tags/')
    concurrency:
      group: deployment-prod
    env:
      RSA_PRIVATE_KEY: ${{ secrets.RSA_PRIVATE_KEY }}
      DEPLOY_IP: ${{ secrets.DEPLOY_IP }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up SSH key for connection
        run: |
          mkdir -p ~/.ssh
          echo "$RSA_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa

      - name: Add SSH known hosts
        run: |
          ssh-keyscan -H ${{ secrets.DEPLOY_IP }} >> ~/.ssh/known_hosts

      - name: Stop nginx before deployment
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "
            # Force kill the container if it exists
            docker kill team77-nginx || true
            # Sleep to ensure it's fully stopped
            sleep 5
            # Force remove the container
            docker rm -f team77-nginx || true
            # Sleep again to ensure Docker has released the resources
            sleep 5
          "

      - name: Clear previous deployment on VM (Prod)
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "rm -rf ~/team-project-prod || true"

      - name: Create environment files on VM (Prod)
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "mkdir -p ~/team-project-prod"
          
          # Create db.env file
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "cat > ~/team-project-prod/db.env << 'EOL'
          POSTGRES_USER=${{ secrets.PROD_DB_USER }}
          POSTGRES_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}
          POSTGRES_DB=${{ secrets.PROD_DB_NAME }}
          EOL"
          
          # Create server.env file with proper database connection parameters
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "cat > ~/team-project-prod/server.env << 'EOL'
          NODE_ENV=production
          PORT=8080
          JWT_SECRET=${{ secrets.PROD_JWT_SECRET }}
          DATABASE_URL=postgres://${{ secrets.PROD_DB_USER }}:${{ secrets.PROD_DB_PASSWORD }}@db:5432/${{ secrets.PROD_DB_NAME }}
          DB_HOST=db
          DB_PORT=5432
          POSTGRES_USER=${{ secrets.PROD_DB_USER }}
          POSTGRES_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}
          POSTGRES_DB=${{ secrets.PROD_DB_NAME }}
          EOL"
          
          # Create client.env file
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "cat > ~/team-project-prod/client.env << 'EOL'
          REACT_APP_API_URL=${{ secrets.PROD_API_URL }}
          VITE_API_URL=${{ secrets.PROD_API_URL }}
          EOL"
          
      - name: Transfer deployment files to VM (Prod)
        run: |
          scp -o StrictHostKeyChecking=no -r ./docker/prd.yml $DEPLOY_USER@$DEPLOY_IP:~/team-project-prod/
          scp -o StrictHostKeyChecking=no -r ./docker/reverse-proxy.yml $DEPLOY_USER@$DEPLOY_IP:~/team-project-prod/
          scp -o StrictHostKeyChecking=no -r ./docker/nginx.conf $DEPLOY_USER@$DEPLOY_IP:~/team-project-prod/
          # Transfer migration helpers with recursive flag for directories
          scp -o StrictHostKeyChecking=no -r ./server/src/migrations $DEPLOY_USER@$DEPLOY_IP:~/team-project-prod/migrations
          scp -o StrictHostKeyChecking=no -r ./server/src/seeders $DEPLOY_USER@$DEPLOY_IP:~/team-project-prod/seeders
          scp -o StrictHostKeyChecking=no -r ./server/src/models $DEPLOY_USER@$DEPLOY_IP:~/team-project-prod/models

      - name: Create required network
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "
            # Make sure the common-network exists but don't recreate it if it does
            docker network inspect common-network >/dev/null 2>&1 || docker network create common-network
          "

      - name: Clean up old containers and volumes on VM (Prod)
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "
            # Stop and remove all containers in the prod project
            docker compose -f ~/team-project-prod/prd.yml -p team77-prod down --volumes --remove-orphans || true
            
            # Explicitly remove volumes
            docker volume rm team77-prod-db-data team77-prod-uploads || true
            
            # Prune unused containers
            docker container prune -f
            
            # Create fresh volumes
            docker volume create team77-prod-db-data
            docker volume create team77-prod-uploads
            
            # Initialize upload directories
            docker run --rm \
              --name upload-init-prod \
              -v team77-prod-uploads:/app/uploads \
              alpine:latest \
              sh -c 'mkdir -p /app/uploads/{images,pdfs,misc} && chmod -R 777 /app/uploads'
          "

      - name: Start Database Container (Prod)
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "
            # Start just the database container
            docker compose -f ~/team-project-prod/prd.yml -p team77-prod up -d db
          "

      - name: Wait for Database to be fully ready (Prod)
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "
            # Wait for the database to be properly initialized
            for i in \$(seq 1 60); do
              echo \"Attempt \$i: Checking database readiness...\"
              
              # Simpler check - just verify the server is accepting connections
              if docker exec team77-prod-db pg_isready; then
                echo \"Database is accepting connections!\"
                # Give it a little extra time to fully initialize
                sleep 10
                break
              fi
              
              echo \"Database not ready yet. Waiting...\"
              sleep 5
            done
          "

      - name: Run Migrations and Seeders (Prod)
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "
            # Create temporary config file with database connection
            mkdir -p ~/team-project-prod/config
            cat > ~/team-project-prod/config/config.js << 'EOL'
            module.exports = {
              production: {
                username: '${{ secrets.PROD_DB_USER }}',
                password: '${{ secrets.PROD_DB_PASSWORD }}',
                database: '${{ secrets.PROD_DB_NAME }}',
                host: 'db',
                dialect: 'postgres',
                dialectOptions: {
                  useUTC: false,
                  prependSearchPath: true
                },
                searchPath: 'public',
                define: {
                  freezeTableName: true,
                  underscored: false
                }
              }
            };
            EOL
            
            # Create a temporary container to run migrations
            docker run --rm --name team77-migrations-prod \
              --network common-network \
              -v ~/team-project-prod/migrations:/app/migrations \
              -v ~/team-project-prod/seeders:/app/seeders \
              -v ~/team-project-prod/models:/app/models \
              -v ~/team-project-prod/config:/app/src/config \
              -e NODE_ENV=production \
              ghcr.io/uob-team-project/team77-server:latest \
              sh -c 'cd /app && npx sequelize-cli db:migrate && npx sequelize-cli db:seed:all'
          "

      - name: Start Remaining Services (Prod)
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "
            docker compose -f ~/team-project-prod/prd.yml -p team77-prod up -d && 
            docker system prune --force --filter 'until=24h'
          "

      - name: Deploy nginx (Production)
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "cd ~/team-project-prod && docker compose -f reverse-proxy.yml -p team77-proxy up -d --remove-orphans"