name: Build and Deploy UniHub Application

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push the server image
      - name: Build and Push Server Image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/unihub-server:latest ./server
          docker push ghcr.io/${{ github.repository_owner }}/unihub-server:latest

      # Build and push the client image
      - name: Build and Push Client Image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/unihub-client:latest ./client
          docker push ghcr.io/${{ github.repository_owner }}/unihub-client:latest

  deploy:
    name: Deploy Application on Azure VM
    runs-on: self-hosted
    needs: build
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.RSA_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DEPLOY_IP }} >> ~/.ssh/known_hosts

      - name: Deploy Application via SSH
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_IP }} << 'EOF'
            echo "🚀 Stopping and Removing Existing Containers..."
            docker stop unihub_client unihub_server || true
            docker rm unihub_client unihub_server || true

            echo "📥 Pulling New Images from GHCR..."
            docker pull ghcr.io/${{ github.repository_owner }}/unihub-server:latest
            docker pull ghcr.io/${{ github.repository_owner }}/unihub-client:latest

            echo "🔄 Starting Application Using Docker Compose..."
            docker compose -f ~/team77/docker-compose.yml up -d

            echo "✅ Deployment Completed Successfully!"
          EOF
