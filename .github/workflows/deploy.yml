name: Build, Push, and Deploy Docker Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Server Image
        run: |
          docker build -t ghcr.io/uob-team-project/team77-server:${{ github.sha }} ./server
          docker tag ghcr.io/uob-team-project/team77-server:${{ github.sha }} ghcr.io/uob-team-project/team77-server:latest
          docker push ghcr.io/uob-team-project/team77-server:${{ github.sha }}
          docker push ghcr.io/uob-team-project/team77-server:latest

      - name: Build and Push Client Image
        run: |
          docker build -t ghcr.io/uob-team-project/team77-client:${{ github.sha }} ./client
          docker tag ghcr.io/uob-team-project/team77-client:${{ github.sha }} ghcr.io/uob-team-project/team77-client:latest
          docker push ghcr.io/uob-team-project/team77-client:${{ github.sha }}
          docker push ghcr.io/uob-team-project/team77-client:latest

  deploy-dev:
    name: Deploy Development via SSH
    needs: build-push
    runs-on: self-hosted
    if: success() && ( contains(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/tags/') )
    concurrency:
      group: deployment
    env:
      RSA_PRIVATE_KEY: ${{ secrets.RSA_PRIVATE_KEY }}
      DEPLOY_IP: ${{ secrets.DEPLOY_IP }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up SSH key for connection
        run: |
          mkdir -p ~/.ssh
          echo "$RSA_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa

      - name: Add SSH known hosts
        run: |
          ssh-keyscan -H ${{ secrets.DEPLOY_IP }} >> ~/.ssh/known_hosts

      - name: Deploy Development
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "docker compose -f ~/team-project/dev.yml up -d --remove-orphans && docker system prune --force --filter 'until=24h'"

  deploy-prod:
    name: Deploy Production via SSH
    needs: deploy-dev
    runs-on: self-hosted
    if: success() && startsWith(github.ref, 'refs/tags/')
    concurrency:
      group: deployment
    env:
      RSA_PRIVATE_KEY: ${{ secrets.RSA_PRIVATE_KEY }}
      DEPLOY_IP: ${{ secrets.DEPLOY_IP }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up SSH key for connection
        run: |
          mkdir -p ~/.ssh
          echo "$RSA_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa

      - name: Add SSH known hosts
        run: |
          ssh-keyscan -H ${{ secrets.DEPLOY_IP }} >> ~/.ssh/known_hosts

      - name: Deploy Production
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_IP "docker compose -f ~/team-project/prd.yml up -d --remove-orphans && docker system prune --force --filter 'until=24h'"
