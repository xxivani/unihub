name: Build, Push, and Deploy Docker Images

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Server Image
        run: |
          docker build -t ghcr.io/uob-team-project/team77-server:${{ github.sha }} ./server
          docker tag ghcr.io/uob-team-project/team77-server:${{ github.sha }} ghcr.io/uob-team-project/team77-server:latest
          docker push ghcr.io/uob-team-project/team77-server:${{ github.sha }}
          docker push ghcr.io/uob-team-project/team77-server:latest

      - name: Build and Push Client Image
        run: |
          docker build -t ghcr.io/uob-team-project/team77-client:${{ github.sha }} ./client
          docker tag ghcr.io/uob-team-project/team77-client:${{ github.sha }} ghcr.io/uob-team-project/team77-client:latest
          docker push ghcr.io/uob-team-project/team77-client:${{ github.sha }}
          docker push ghcr.io/uob-team-project/team77-client:latest

  deploy:
    needs: build-push
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy with Docker Compose
        run: |
          # Ensure you're in the directory with your docker-compose.yml file (update the path if necessary)
          cd .
          # Pull the latest images from GHCR
          docker-compose pull
          # Bring down any existing containers (ignore errors if none exist)
          docker-compose down || true
          # Start the containers in detached mode
          docker-compose up -d
          # Optional: Clean up unused Docker objects
          docker system prune --force --filter "until=24h"
