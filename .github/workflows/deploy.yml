name: Build, Push, and Deploy Docker Images

on:
  push:
    tags:
      - '*'



permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Server Image
        run: |
          docker build -t ghcr.io/uob-team-project/team77-server:${{ github.sha }} ./server
          docker tag ghcr.io/uob-team-project/team77-server:${{ github.sha }} ghcr.io/uob-team-project/team77-server:latest
          docker push ghcr.io/uob-team-project/team77-server:${{ github.sha }}
          docker push ghcr.io/uob-team-project/team77-server:latest

      - name: Build and Push Client Image
        run: |
          docker build -t ghcr.io/uob-team-project/team77-client:${{ github.sha }} ./client
          docker tag ghcr.io/uob-team-project/team77-client:${{ github.sha }} ghcr.io/uob-team-project/team77-client:latest
          docker push ghcr.io/uob-team-project/team77-client:${{ github.sha }}
          docker push ghcr.io/uob-team-project/team77-client:latest
  
  deploy:
    needs: build-push
    runs-on: self-hosted
    steps:
      - name: Cleanup problematic directories
        run: |
          sudo rm -rf /home/ubuntu/actions-runner/_work/team77/team77/caddy/config/caddy || true
          sudo rm -rf /home/ubuntu/actions-runner/_work/team77/team77/caddy/data/caddy || true

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Manual GHCR login (if needed)
        run: |
          docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure Docker Compose v2 is installed
        run: |
          if ! docker compose version >/dev/null 2>&1; then
            echo "Docker Compose v2 not found. Installing..."
            sudo apt-get update
            sudo apt-get install -y docker-compose-plugin
          else
            echo "Docker Compose v2 is already installed."
          fi

      - name: Deploy with Docker Compose v2
        run: |
          docker compose pull
          docker compose down || true
          docker compose up -d
          docker system prune --force --filter "until=24h"

      - name: Restart Caddy to Apply Changes
        run: |
          docker compose restart caddy || true
