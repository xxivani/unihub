name: Build, Push and Deploy Application

on:
  push:
    branches:
      - main

jobs:
  build-push-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Server Docker Image
        run: |
          echo "Building Server Image..."
          docker build -t ghcr.io/${{ github.repository_owner }}/${{ github.repository }}-server:${{ github.sha }} ./server
          docker tag ghcr.io/${{ github.repository_owner }}/${{ github.repository }}-server:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/${{ github.repository }}-server:latest
          echo "Pushing Server Image..."
          docker push ghcr.io/${{ github.repository_owner }}/${{ github.repository }}-server:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/${{ github.repository }}-server:latest

      - name: Build and Push Client Docker Image
        run: |
          echo "Building Client Image..."
          docker build -t ghcr.io/${{ github.repository_owner }}/${{ github.repository }}-client:${{ github.sha }} ./client
          docker tag ghcr.io/${{ github.repository_owner }}/${{ github.repository }}-client:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/${{ github.repository }}-client:latest
          echo "Pushing Client Image..."
          docker push ghcr.io/${{ github.repository_owner }}/${{ github.repository }}-client:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/${{ github.repository }}-client:latest

      - name: Deploy with Docker Compose
        run: |
          echo "Deploying application with docker-compose..."
          # Bring down any running containers (ignore errors if none are running)
          docker-compose down || true
          # Pull the latest images (from GHCR)
          docker-compose pull
          # Start containers in detached mode
          docker-compose up -d
          # Optional cleanup: remove unused Docker objects
          docker system prune --force --filter "until=24h"
