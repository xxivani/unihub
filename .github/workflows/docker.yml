name: Build and Deploy UniHub Application

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  #  Build & Test (Runs on GitHub-hosted runner)
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install frontend dependencies
        run: |
          cd client
          npm install

      - name: Build frontend
        run: |
          cd client
          npm run build

      - name: Install backend dependencies
        run: |
          cd server
          npm install

      - name: Run backend tests
        run: |
          cd server
          npm test || echo "⚠️ No tests found, skipping..."

  # Push Docker Image to GHCR (Runs on self-hosted runner)
  publish-docker:
    runs-on: self-hosted
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/unihub:latest .
          docker push ghcr.io/${{ github.repository_owner }}/unihub:latest

  # Deploy to Azure VM
  deploy:
    runs-on: self-hosted
    needs: publish-docker
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.RSA_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DEPLOY_IP }} >> ~/.ssh/known_hosts

      - name: Deploy application on Azure VM
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_IP }} << 'EOF'
            docker stop unihub || true
            docker rm unihub || true
            docker pull ghcr.io/${{ github.repository_owner }}/unihub:latest
            docker run -d --restart=always -p 80:3000 --name unihub ghcr.io/${{ github.repository_owner }}/unihub:latest
          EOF
