version: "3.8"

services:
  server:
    image: ghcr.io/uob-team-project/team77-server:latest
    restart: always
    ports:
      - "3000:3000"  
    environment:
      NODE_ENV: production
    logging:
      driver: "json-file"
      options:
        max-size: "10m"

  client:
    image: ghcr.io/uob-team-project/team77-client:latest
    restart: always
    ports:
      - "80:80"      
    environment:
      NODE_ENV: production
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
