version: "3.8"

services:
  db:
    image: postgres
    container_name: unihub_db
    restart: always
    environment:
      POSTGRES_USER: team77
      POSTGRES_PASSWORD: team77
      POSTGRES_DB: UniHub
    ports:
      - "5432:5432"

  server:
    image: ghcr.io/uob-team-project/unihub-server:latest  
    container_name: unihub_server
    restart: always
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_USER=team77
      - DB_PASSWORD=team77
      - DB_NAME=UniHub
      - DB_PORT=5432
    ports:
      - "5000:5000"

  client:
    image: ghcr.io/uob-team-project/unihub-client:latest 
    container_name: unihub_client
    restart: always
    depends_on:
      - server
    ports:
      - "5173:5173"
