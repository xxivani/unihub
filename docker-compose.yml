version: "3.8"

services:
  server:
    image: ghcr.io/uob-team-project/team77-server:latest
    ports:
      - "3000:3000"
    networks:
      - app-network

  client:
    image: ghcr.io/uob-team-project/team77-client:latest
    expose:
      - "80"  
    networks:
      - app-network


networks:
  app-network:
    driver: bridge
