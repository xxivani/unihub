version: "3.8"

services:
  server:
    image: ghcr.io/uob-team-project/team77-server:latest
    ports:
      - "3000:3000"
    networks:
      - app-network

  client:
    image: ghcr.io/uob-team-project/team77-client:latest
    ports:
      - "80:80"
    networks:
      - app-network

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
