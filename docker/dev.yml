# dev.yml
version: "3.8"

services:
  db:
    image: postgres:14-alpine
    container_name: team77-dev-db
    restart: always
    env_file:
      - ./db.env
    volumes:
      - dev-db-data:/var/lib/postgresql/data
    networks:
      - team77-dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  team77-dev-server:
    container_name: team77-dev-server
    image: ghcr.io/uob-team-project/team77-server:latest
    restart: always
    env_file:
      - ./server.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - dev-uploads:/app/uploads
    networks:
      - team77-dev-network
      - common-network
    ports:
      - "8080:8080"

  team77-dev-client:
    container_name: team77-dev-client
    image: ghcr.io/uob-team-project/team77-client:latest
    restart: always
    env_file:
      - ./client.env
    depends_on:
      - team77-dev-server
    networks:
      - team77-dev-network
      - common-network
    ports:
      - "3000:3000"

networks:
  team77-dev-network:
    name: team77-dev-network
  common-network:
    external: true

volumes:
  dev-db-data:
    name: team77-dev-db-data
  dev-uploads:
    name: team77-dev-uploads