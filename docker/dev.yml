version: "3.8"

services:
  db:
    image: postgres:14-alpine
    container_name: team77-dev-db
    restart: always
    env_file:
      - ./db.env  
    volumes:
      - dev-db-data:/var/lib/postgresql/data
    networks:
      - dev-network

  team77-dev-server:
    container_name: team77-dev-server
    image: ghcr.io/uob-team-project/team77-server:latest
    environment:
      - NODE_ENV=development
      - PORT=8080
    
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      - db
    networks:
      - dev-network
    ports:
      - "8080:8080"

  team77-dev-client:
    container_name: team77-dev-client
    image: ghcr.io/uob-team-project/team77-client:latest
    environment:
      - NODE_ENV=development
      - PORT=3000
      - REACT_APP_API_URL=http://team77-dev-server:8080
    depends_on:
      - team77-dev-server
    networks:
      - dev-network
    ports:
      - "3000:3000"

  nginx:
    container_name: team77-dev-nginx
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/www/letsencrypt:/var/www/letsencrypt:ro
      - ./nginx-dev.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/nginx/ssl/dev:/etc/nginx/ssl/dev:ro
    networks:
      - dev-network


networks:
  dev-network:
    driver: bridge

volumes:
  dev-db-data:
