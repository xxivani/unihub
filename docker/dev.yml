version: "3.8"

services:
  db:
    image: postgres:14-alpine
    container_name: team77-dev-db
    restart: always
    env_file:
      - ./db.env  
    volumes:
      - dev-db-data:/var/lib/postgresql/data
    networks:
      - common-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-team77}"]
      interval: 10s
      timeout: 5s
      retries: 5

  team77-dev-server:
    container_name: team77-dev-server
    image: ghcr.io/uob-team-project/team77-server:latest
    environment:
      - NODE_ENV=development
      - PORT=8080
      - POSTGRES_USER=team77
      - POSTGRES_PASSWORD=team77
      - POSTGRES_DB=UniHub
      - DB_HOST=db
      - DB_PORT=5432
      - DATABASE_URL=postgres://team77:team77@db:5432/UniHub
    depends_on:
      db:
        condition: service_healthy
    networks:
      - common-network
    ports:
      - "8080:8080"
    command: >
      sh -c "
        echo 'Waiting for database connection...' &&
        until nc -z db 5432; do
          echo 'Database is unavailable - sleeping'
          sleep 2
        done &&
        echo 'Database is up - starting server' &&
        npm start
      "

  team77-dev-client:
    container_name: team77-dev-client
    image: ghcr.io/uob-team-project/team77-client:latest
    environment:
      - NODE_ENV=development
      - PORT=3000
      - REACT_APP_API_URL=http://team77-dev-server:8080
    depends_on:
      - team77-dev-server
    networks:
      - common-network
    ports:
      - "3000:3000"

networks:
  common-network:
    name: common-network
    driver: bridge

volumes:
  dev-db-data: