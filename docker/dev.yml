# dev.yml
services:
  db:
    image: postgres:14-alpine
    container_name: team77-dev-db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-team77_dev}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secure_dev_password}
      - POSTGRES_DB=${POSTGRES_DB:-team77_dev}
    env_file:
      - ./dev.env
    volumes:
      - dev-db-data:/var/lib/postgresql/data
    networks:
      - team77-dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5

  team77-dev-server:
    container_name: team77-dev-server
    image: ghcr.io/uob-team-project/team77-server:latest
    restart: always
    env_file:
      - ./dev.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - dev-uploads:/app/uploads
    networks:
      - team77-dev-network
      - common-network
    ports:
      - "8080:8080"

  team77-dev-client:
    container_name: team77-dev-client
    image: ghcr.io/uob-team-project/team77-client:latest
    restart: always
    env_file:
      - ./dev.env
    depends_on:
      - team77-dev-server
    networks:
      - team77-dev-network
      - common-network
    ports:
      - "3000:3000"

networks:
  team77-dev-network:
    external: true
  common-network:
    external: true

volumes:
  dev-db-data:
    name: team77-dev-db-data
  dev-uploads:
    name: team77-dev-uploads
    external: true