version: "3.8"

services:
  db:
    image: postgres:14-alpine
    container_name: team77-prod-db
    restart: always
    env_file:
      - ./db.env  
    volumes:
      - prod-db-data:/var/lib/postgresql/data
    networks:
      - common-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U team77"]  
      interval: 10s
      timeout: 5s
      retries: 5

  team77-prd-server:
    container_name: team77-prd-server
    image: ghcr.io/uob-team-project/team77-server:latest
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=8080
      - POSTGRES_USER=team77
      - POSTGRES_PASSWORD=team77
      - POSTGRES_DB=team77
      - DB_HOST=team77-prod-db
      - DB_PORT=5432
      - JWT_SECRET=team77_secret
      - DATABASE_URL=postgres://team77:team77@team77-prod-db:5432/team77
    depends_on:
      - db
    volumes:
      - prod-uploads:/app/uploads
    networks:
      - common-network
    ports:
      - "9090:8080"

  team77-prd-client:
    container_name: team77-prd-client
    image: ghcr.io/uob-team-project/team77-client:latest
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=80
      - REACT_APP_API_URL=https://team77.bham.team/api
      - VITE_API_URL=https://team77.bham.team/api
    depends_on:
      - team77-prd-server
    networks:
      - common-network
    expose:
      - "80"
      
networks:
  common-network:
    external: true

volumes:
  prod-db-data:
  prod-uploads: