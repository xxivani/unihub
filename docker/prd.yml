
services:
  db:
    image: postgres:14-alpine
    container_name: team77-prod-db
    restart: always
    env_file:
      - ./db.env
    volumes:
      - prod-db-data:/var/lib/postgresql/data
    networks:
      - team77-prod-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  team77-prd-server:
    container_name: team77-prd-server
    image: ghcr.io/uob-team-project/team77-server:latest
    restart: always
    env_file:
      - ./server.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - prod-uploads:/app/uploads
    networks:
      - team77-prod-network
      - common-network
    ports:
      - "9090:8080"

  team77-prd-client:
    container_name: team77-prd-client
    image: ghcr.io/uob-team-project/team77-client:latest
    restart: always
    env_file:
      - ./client.env
    depends_on:
      - team77-prd-server
    networks:
      - team77-prod-network
      - common-network
    expose:
      - "80"
      
networks:
  team77-prod-network:
    external: true 
  common-network:
    external: true

volumes:
  prod-db-data:
    name: team77-prod-db-data
  prod-uploads:
    name: team77-prod-uploads