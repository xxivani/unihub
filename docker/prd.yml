version: "3.8"

services:
  db:
    image: postgres:14-alpine
    container_name: team77-db
    restart: always
    env_file:
      - ./db.env  
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - common-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  team77-prd-server:
    container_name: team77-prd-server
    image: ghcr.io/uob-team-project/team77-server:latest
    restart: always
    env_file:
      - ./db.env
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DB_HOST=db
      - DB_PORT=5432
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - common-network
    ports:
      - "9090:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  team77-prd-client:
    container_name: team77-prd-client
    image: ghcr.io/uob-team-project/team77-client:latest
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=80
      - REACT_APP_API_URL=https://team77.bham.team/api
      - VITE_API_URL=https://team77.bham.team/api
    depends_on:
      team77-prd-server:
        condition: service_healthy
    networks:
      - common-network
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
      
networks:
  common-network:
    external: true

volumes:
  db-data: