version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: team77-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/nginx/ssl/dev:/etc/nginx/ssl/dev
      - /etc/nginx/ssl/prod:/etc/nginx/ssl/prod
      - /var/www/letsencrypt:/var/www/letsencrypt
    networks:
      - common-network

networks:
  common-network:
    external: true
