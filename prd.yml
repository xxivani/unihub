version: "3.8"

services:
  team77-prd-server:
    container_name: team77-prd-server
    image: ghcr.io/uob-team-project/team77-server:latest
    environment:
      - NODE_ENV=production
      - PORT=8080
    ports:
      - "8080:8080"
    networks:
      - prd-network

  team77-prd-client:
    container_name: team77-prd-client
    image: ghcr.io/uob-team-project/team77-client:latest
    environment:
      - NODE_ENV=production
      - PORT=80
      - REACT_APP_API_URL=http://team77-prd-server:8080
    ports:
      - "80:80"
    networks:
      - prd-network

networks:
  prd-network:
    driver: bridge
